<script>
(function () {
  'use strict';
  var ROUNDS = JSON.parse(document.getElementById('rounds').textContent);   // 新在前
  var FAV_KEY = 'dfp:favs';
  var COLOR = { today: '', week: 'gold', dark: 'teal' };
  var TYPE_NAME = { video: '视频', normal: '图文' };   // TikHub 的原始取值
  // 每个板块可切换的排序字段；第一个是默认，也决定卡片上的大数字显示什么
  var SORTS = {
    today: [['ratio', '倍数'], ['likes', '点赞'], ['collected', '收藏'], ['comments', '评论']],
    week:  [['likes', '点赞'], ['collected', '收藏'], ['comments', '评论']],
    dark:  [['likes', '点赞'], ['ratio', '倍数'], ['collected', '收藏'], ['comments', '评论']]
  };
  var state = { roundId: ROUNDS[0].round.id, q: '', sort: {} };

  // ---------- 收藏：只存在这台设备的浏览器里 ----------
  function loadFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '{}'); } catch (e) { return {}; } }
  function saveFavs(f) { try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {} }
  var favs = loadFavs();

  // ---------- 全量索引：跨轮次搜索和收藏都从这里查 ----------
  var ALL = [];
  ROUNDS.forEach(function (r) { r.boards.forEach(function (b) { b.items.forEach(function (it) { ALL.push({ it: it, b: b, r: r }); }); }); });
  var BY_ID = {};
  ALL.forEach(function (x) { if (!BY_ID[x.it.noteId]) BY_ID[x.it.noteId] = x; });   // 同一篇取最新一轮

  // ---------- 工具 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) {
    if (n == null || isNaN(n)) return '—';
    if (n >= 10000) { var w = Math.round(n / 1000) / 10; return (w % 1 ? w.toFixed(1) : w) + '万'; }
    return Number(n).toLocaleString('en-US');
  }
  function ago(it, r) {
    if (!it.published) return '';
    var h = (new Date(r.round.generatedAt) - new Date(it.published)) / 36e5;
    if (h < 0) return '';
    return h < 48 ? Math.round(h) + ' 小时前' : (h / 24).toFixed(1) + ' 天前';
  }
  function dateOf(it) {
    if (!it.published) return '';
    var d = new Date(it.published); return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function displayTitle(it) {
    if (it.title) return it.title;
    // 没标题就用正文开头，去掉 #话题 和 @提及
    var d = (it.desc || '').replace(/[#@][^\s#@]+/g, ' ').replace(/\s+/g, ' ').trim();
    return d ? (d.length > 40 ? d.slice(0, 40) + '…' : d) : '(无标题)';
  }
  function commentShare(it) {
    var base = (it.likes || 0) + (it.collected || 0) + (it.comments || 0);
    return base ? (100 * (it.comments || 0) / base).toFixed(1) + '%' : '—';
  }
  function findRound(id) { for (var i = 0; i < ROUNDS.length; i++) if (ROUNDS[i].round.id === id) return ROUNDS[i]; return ROUNDS[0]; }

  // ---------- 卡片 ----------
  function keyBlock(it, b, sortKey) {
    var big, unit, sub;
    if (sortKey === 'ratio' && b.key === 'today') { big = it.ratio; unit = '倍'; sub = fmt(it.likes) + ' 赞 · 作者平常 ' + fmt(it.baseline) + ' 赞'; }
    else if (sortKey === 'ratio') { big = it.ratio; unit = '倍'; sub = fmt(it.likes) + ' 赞 · 粉丝 ' + fmt(it.fans); }
    else { big = fmt(it[sortKey]); unit = { likes: '赞', collected: '收藏', comments: '评论' }[sortKey];
           sub = b.key === 'today' ? '比作者平常高 ' + it.ratio + ' 倍' : b.key === 'dark' ? '粉丝 ' + fmt(it.fans) + ' · ' + it.ratio + ' 倍' : fmt(it.collected) + ' 收藏'; }
    return '<span class="key"><b>' + esc(big) + '</b><span>' + unit + '</span><em>' + esc(sub) + '</em></span>';
  }
  function card(x, i, sortKey, showBadge) {
    var it = x.it, b = x.b, r = x.r;
    var meta = ['@' + esc(it.author || '')];
    if (b.key === 'dark') meta.push('<b class="fans">发布时约 ' + fmt(it.fans) + ' 粉</b>'); else if (it.type) meta.push(esc(TYPE_NAME[it.type] || it.type));
    meta.push(showBadge ? esc(dateOf(it)) : esc(ago(it, r)));
    var stats = '<span><b>' + fmt(it.likes) + '</b> 赞</span><span><b>' + fmt(it.collected) + '</b> 藏</span>' +
                '<span><b>' + fmt(it.comments) + '</b> 评</span><span><b>' + fmt(it.shared) + '</b> 转</span>' +
                '<span title="评论 ÷ (赞+藏+评)">评论占比 <b>' + commentShare(it) + '</b></span>';
    var badge = showBadge ? '<span class="badge ' + COLOR[b.key] + '">' + esc(b.name) + '</span>' : '';
    var fav = !!favs[it.noteId];
    return '<li class="row">' +
      '<span class="rank">' + (i + 1) + '</span>' +
      (it.thumb ? '<img class="th" src="' + esc(it.thumb) + '" alt="" loading="lazy" width="72" height="72">' : '<span class="th th--none"></span>') +
      '<span class="main"><span class="t">' + badge + esc(displayTitle(it)) + '</span>' +
      '<span class="meta">' + meta.join('<i>·</i>') + '</span><span class="stats">' + stats + '</span></span>' +
      keyBlock(it, b, sortKey) +
      '<button class="star" type="button" data-id="' + esc(it.noteId) + '" aria-pressed="' + fav + '" aria-label="' + (fav ? '取消收藏' : '收藏') + '">' + (fav ? '★' : '☆') + '</button>' +
      '<a class="go" href="' + esc(it.link) + '" target="_blank" rel="noopener">打开 ↗</a></li>';
  }
  function sortBtns(b) {
    var cur = state.sort[b.key] || SORTS[b.key][0][0];
    return '<span class="sort">排序' + SORTS[b.key].map(function (s) {
      return '<button type="button" data-board="' + b.key + '" data-sort="' + s[0] + '" aria-pressed="' + (s[0] === cur) + '">' + s[1] + '</button>';
    }).join('') + '</span>';
  }
  function sorted(items, key) {
    return items.slice().sort(function (a, c) { return (c[key] || 0) - (a[key] || 0) || (c.likes || 0) - (a.likes || 0); });
  }
  function boardSection(b, r) {
    var key = state.sort[b.key] || SORTS[b.key][0][0];
    var items = sorted(b.items, key);
    var note = SORTS[b.key].filter(function (s) { return s[0] === key; })[0][1];
    return '<section id="' + b.key + '" class="' + COLOR[b.key] + '"><div class="sec"><div class="lead">' +
      '<h2>' + esc(b.name) + '<span class="cnt">' + items.length + ' 篇</span></h2>' +
      '<p class="why">' + esc(b.rule) + '<br>按<b>' + esc(note === '倍数' ? (b.key === 'today' ? '比作者平时高多少倍' : '点赞数是粉丝数的多少倍') : note) + '</b>排序' +
      (b.key === 'dark' ? '（粉丝数为上榜时数值，作者现在可能已涨粉）' : '') + '</p></div>' + sortBtns(b) + '</div>' +
      '<ul class="list">' + items.map(function (it, i) { return card({ it: it, b: b, r: r }, i, key, false); }).join('') + '</ul></section>';
  }
  function favSection() {
    var list = Object.keys(favs).map(function (id) { return BY_ID[id]; }).filter(Boolean)
      .sort(function (a, c) { return (favs[c.it.noteId] || 0) - (favs[a.it.noteId] || 0); });
    return '<section id="favs" class="star"><div class="sec"><div class="lead"><h2>我的收藏<span class="cnt">' + list.length + ' 篇</span></h2>' +
      '<p class="why">点卡片上的 ☆ 存起来，要做内容时直接从这里翻。只存在这台设备的浏览器里。</p></div></div>' +
      (list.length ? '<ul class="list">' + list.map(function (x, i) { return card(x, i, 'likes', true); }).join('') + '</ul>'
                   : '<ul class="list"><li class="empty">还没有收藏。</li></ul>') + '</section>';
  }
  function searchSection(q) {
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    var hits = ALL.filter(function (x) {
      var hay = [x.it.title, x.it.desc, x.it.author].join(' ').toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) >= 0; });
    });
    var seen = {}; hits = hits.filter(function (x) { if (seen[x.it.noteId]) return false; seen[x.it.noteId] = 1; return true; });
    hits.sort(function (a, c) { return (c.it.likes || 0) - (a.it.likes || 0); });
    return '<section id="search"><div class="sec"><div class="lead"><h2>搜索「' + esc(q) + '」<span class="cnt">' + hits.length + ' 篇</span></h2>' +
      '<p class="why">在所有轮次的三个板块里找，按点赞排序</p></div></div>' +
      (hits.length ? '<ul class="list">' + hits.map(function (x, i) { return card(x, i, 'likes', true); }).join('') + '</ul>'
                   : '<ul class="list"><li class="empty">没找到。换个词试试，比如食材名或菜名。</li></ul>') + '</section>';
  }

  // ---------- 渲染 ----------
  function renderHead() {
    var r = findRound(state.roundId), total = r.boards.reduce(function (n, b) { return n + b.items.length; }, 0);
    var pick = ROUNDS.length > 1
      ? '<select id="pick" aria-label="选择轮次">' + ROUNDS.map(function (x) { return '<option value="' + esc(x.round.id) + '"' + (x.round.id === r.round.id ? ' selected' : '') + '>' + esc(x.round.label) + ' 轮次</option>'; }).join('') + '</select>'
      : esc(r.round.label) + ' 轮次';
    document.getElementById('round').innerHTML = pick + '<span style="color:var(--faint)">·</span>共 <b>' + total + '</b> 篇';
    document.getElementById('tabs').innerHTML = r.boards.map(function (b) { return '<a href="#' + b.key + '">' + esc(b.name) + ' ' + b.items.length + '</a>'; }).join('') +
      '<a href="#favs">我的收藏 ' + Object.keys(favs).length + '</a>';
  }
  function render() {
    renderHead();
    var r = findRound(state.roundId);
    document.getElementById('boards').innerHTML = state.q
      ? searchSection(state.q)
      : r.boards.map(function (b) { return boardSection(b, r); }).join('') + favSection();
    document.getElementById('clear').hidden = !state.q;
  }
  document.getElementById('foot').innerHTML = "<b>共同要求</b>：三个板块的每一篇都逐条读过正文，只保留含做法、配方或制作过程的内容；探店、吃播、测评、广告、生活记录一律不计入。<br><b>数据</b>：今日爆款与本周大爆款来自 TikHub，55 个关键词；低粉黑马来自红狐黑马榜，以及同一批搜索结果里作者粉丝 5000 以内的作品。赞、藏、评、转都是采集时的快照。<br><b>打开原文</b>：手机上点\"打开\"直接进小红书 App。电脑上小红书网页版看任何笔记都要先登录，这是平台规定，不是链接的问题。<br><b>评论占比</b>＝评论 ÷（赞＋藏＋评）。平台不提供观看数和曝光数，所以算不出严格的互动率和封面点击率。<br><b>收藏</b>：存在这台设备的浏览器里，换设备或清缓存会丢。";

  // ---------- 交互 ----------
  document.getElementById('boards').addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.classList.contains('star')) {
      var id = t.dataset.id;
      if (favs[id]) delete favs[id]; else favs[id] = Date.now();
      saveFavs(favs); render(); return;
    }
    if (t.dataset.sort) { state.sort[t.dataset.board] = t.dataset.sort; render(); }
  });
  document.getElementById('round').addEventListener('change', function (e) {
    if (e.target.id === 'pick') { state.roundId = e.target.value; render(); }
  });
  var q = document.getElementById('q');
  q.addEventListener('input', function () { state.q = q.value.trim(); render(); });
  document.getElementById('clear').addEventListener('click', function () { q.value = ''; state.q = ''; render(); q.focus(); });
  render();
})();
</script>
</body>
</html>
