<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="{{DESCRIPTION}}">
<title>深夜食堂选题台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
img { max-width:100% } [hidden] { display:none !important }
html { color-scheme:light dark; scroll-behavior:smooth }
@media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto } }
:root { --ground:#FAF7F2; --surface:#fff; --surface-2:#F4EFE7;
 --ink:#2A2521; --soft:#7A6F64; --faint:#A79C90;
 --hot:#B3392F; --gold:#8C6A2B; --teal:#2F6B62; --star:#C9962B; --line:#E8E0D5;
 --serif:"Noto Serif SC","Songti SC",serif;
 --sans:"DM Sans","PingFang SC","Hiragino Sans GB",system-ui,sans-serif; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) {
 --ground:#17140F; --surface:#211D17; --surface-2:#2B261E;
 --ink:#F2ECE2; --soft:#A2968A; --faint:#7B7064;
 --hot:#E0705F; --gold:#D6B36B; --teal:#6FB3A6; --star:#E2B85A; --line:#322C24; } }
:root[data-theme="dark"] { --ground:#17140F; --surface:#211D17; --surface-2:#2B261E;
 --ink:#F2ECE2; --soft:#A2968A; --faint:#7B7064;
 --hot:#E0705F; --gold:#D6B36B; --teal:#6FB3A6; --star:#E2B85A; --line:#322C24; }
body { background:var(--ground); color:var(--ink); font:14px var(--sans); -webkit-font-smoothing:antialiased; }
.wrap { max-width:940px; margin:0 auto; padding:26px 18px 70px; }
.head { display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 16px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.brand { font-family:var(--serif); font-weight:700; font-size:21px; }
.round { color:var(--soft); font-size:13px; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:6px; }
.round b { color:var(--ink); font-weight:500; }
.round select { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:3px 8px; }
.tag { margin-left:auto; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); border:1px solid var(--line); border-radius:999px; padding:4px 10px; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:16px 0 0; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; }
.tabs a { font-size:13px; text-decoration:none; color:var(--soft); border:1px solid var(--line); border-radius:999px; padding:5px 13px; background:var(--surface); }
.tabs a:hover { color:var(--ink); border-color:var(--soft); }
.tabs a:focus-visible, .go:focus-visible, .star:focus-visible, .q:focus-visible { outline:2px solid var(--hot); outline-offset:2px; }
.search { margin-left:auto; position:relative; flex:1 1 220px; max-width:320px; }
.q { width:100%; font:inherit; font-size:13px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 30px 6px 14px; }
.q::placeholder { color:var(--faint); }
.clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--faint); font-size:15px; cursor:pointer; padding:2px 6px; line-height:1; }
.clear:hover { color:var(--ink); }
section { margin-top:36px; scroll-margin-top:14px; }
.sec { border-left:3px solid var(--hot); padding-left:12px; margin-bottom:12px; display:flex; flex-wrap:wrap; align-items:flex-start; gap:6px 16px; }
section.gold .sec { border-left-color:var(--gold); } section.teal .sec { border-left-color:var(--teal); } section.star .sec { border-left-color:var(--star); }
.sec .lead { flex:1 1 320px; min-width:0; }
.sec h2 { font-family:var(--serif); font-size:17px; font-weight:700; margin:0 0 3px; }
.sec h2 .cnt { font-family:var(--sans); font-size:12px; font-weight:600; color:var(--hot); margin-left:8px; font-variant-numeric:tabular-nums; }
section.gold .sec h2 .cnt { color:var(--gold); } section.teal .sec h2 .cnt { color:var(--teal); } section.star .sec h2 .cnt { color:var(--star); }
.sec .why { font-size:12.5px; color:var(--soft); line-height:1.7; margin:0; max-width:64ch; }
.sec .why b { color:var(--ink); font-weight:500; }
.sort { display:flex; gap:4px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--faint); }
.sort button { font:inherit; font-size:12px; color:var(--soft); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px 10px; cursor:pointer; }
.sort button[aria-pressed="true"] { color:var(--surface); background:var(--ink); border-color:var(--ink); }
ul.list { list-style:none; display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.row { display:grid; grid-template-columns:26px 72px minmax(0,1fr) auto auto auto; align-items:center; gap:12px; padding:11px 14px; background:var(--surface); }
.rank { font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; text-align:right; }
.th { width:72px; height:72px; object-fit:cover; border-radius:8px; display:block; background:var(--surface-2); }
.th--none { display:block; background:var(--surface-2); border-radius:8px; }
.main { min-width:0; display:flex; flex-direction:column; gap:4px; }
.t { font-family:var(--serif); font-size:14.5px; line-height:1.45; font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.t .badge { font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.04em; vertical-align:2px; margin-right:6px; padding:1px 6px; border-radius:999px; color:var(--surface); background:var(--hot); }
.badge.gold { background:var(--gold); } .badge.teal { background:var(--teal); }
.meta { font-size:12px; color:var(--soft); }
.meta i { font-style:normal; margin:0 6px; color:var(--faint); }
.meta b.fans { font-weight:600; color:var(--teal); }
.stats { font-size:11.5px; color:var(--soft); font-variant-numeric:tabular-nums; display:flex; flex-wrap:wrap; gap:2px 0; }
.stats span { white-space:nowrap; } .stats span + span::before { content:"·"; margin:0 6px; color:var(--faint); }
.stats b { font-weight:500; color:var(--ink); }
.key { text-align:right; display:flex; flex-direction:column; gap:2px; color:var(--hot); white-space:nowrap; }
section.gold .key { color:var(--gold); } section.teal .key { color:var(--teal); }
.key b { font-size:21px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
.key span { font-size:11px; font-weight:600; margin-left:2px; }
.key em { font-style:normal; font-size:11px; color:var(--soft); font-variant-numeric:tabular-nums; }
.star { font:inherit; font-size:18px; line-height:1; color:var(--faint); background:none; border:0; cursor:pointer; padding:6px; border-radius:7px; }
.star:hover { color:var(--star); background:var(--surface-2); }
.star[aria-pressed="true"] { color:var(--star); }
.go { font-size:12.5px; color:var(--soft); text-decoration:none; white-space:nowrap; border:1px solid var(--line); border-radius:7px; padding:6px 10px; }
.go:hover { color:var(--ink); border-color:var(--soft); }
.empty { padding:22px 14px; color:var(--soft); font-size:13px; background:var(--surface); }
@media (max-width:640px) {
  .row { grid-template-columns:56px minmax(0,1fr) auto; gap:10px; padding:12px; }
  .rank { display:none; }
  .th, .th--none { width:56px; height:56px; }
  .key b { font-size:18px; } .key em { display:none; }
  .star { grid-column:2; justify-self:start; padding:4px 6px 4px 0; margin-top:2px; }
  .go { grid-column:3; justify-self:end; margin-top:2px; }
  .search { max-width:none; flex-basis:100%; margin-left:0; }
}
.foot { margin-top:40px; padding-top:18px; border-top:1px solid var(--line); font-size:12.5px; color:var(--soft); line-height:1.85; }
.foot b { color:var(--ink); font-weight:500; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="brand">深夜食堂选题台</span>
    <span class="round" id="round"></span>
    <span class="tag">Demo</span>
  </header>
  <div class="bar">
    <nav class="tabs" id="tabs"></nav>
    <div class="search">
      <input class="q" id="q" type="search" placeholder="搜食材、菜名、作者…" aria-label="搜索" autocomplete="off">
      <button class="clear" id="clear" type="button" aria-label="清空搜索" hidden>×</button>
    </div>
  </div>
  <main id="boards"></main>
  <p class="foot" id="foot"></p>
</div>
<script id="rounds" type="application/json">{{ROUNDS_JSON}}</script>
<script>
(function () {
  'use strict';
  var ROUNDS = JSON.parse(document.getElementById('rounds').textContent);   // 新在前
  var FAV_KEY = 'dfp:favs';
  var COLOR = { today: '', week: 'gold', dark: 'teal' };
  var TYPE_NAME = { video: '视频', normal: '图文' };   // TikHub 的原始取值
  // 每个板块可切换的排序字段；第一个是默认，也决定卡片上的大数字显示什么
  var SORTS = {
    today: [['ratio', '倍数'], ['likes', '点赞'], ['collected', '收藏'], ['comments', '评论']],
    week:  [['likes', '点赞'], ['collected', '收藏'], ['comments', '评论']],
    dark:  [['likes', '点赞'], ['ratio', '倍数'], ['collected', '收藏'], ['comments', '评论']]
  };
  var state = { roundId: ROUNDS[0].round.id, q: '', sort: {} };

  // ---------- 收藏：只存在这台设备的浏览器里 ----------
  function loadFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY) || '{}'); } catch (e) { return {}; } }
  function saveFavs(f) { try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch (e) {} }
  var favs = loadFavs();

  // ---------- 全量索引：跨轮次搜索和收藏都从这里查 ----------
  var ALL = [];
  ROUNDS.forEach(function (r) { r.boards.forEach(function (b) { b.items.forEach(function (it) { ALL.push({ it: it, b: b, r: r }); }); }); });
  var BY_ID = {};
  ALL.forEach(function (x) { if (!BY_ID[x.it.noteId]) BY_ID[x.it.noteId] = x; });   // 同一篇取最新一轮

  // ---------- 工具 ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) {
    if (n == null || isNaN(n)) return '—';
    if (n >= 10000) { var w = Math.round(n / 1000) / 10; return (w % 1 ? w.toFixed(1) : w) + '万'; }
    return Number(n).toLocaleString('en-US');
  }
  function ago(it, r) {
    if (!it.published) return '';
    var h = (new Date(r.round.generatedAt) - new Date(it.published)) / 36e5;
    if (h < 0) return '';
    return h < 48 ? Math.round(h) + ' 小时前' : (h / 24).toFixed(1) + ' 天前';
  }
  function dateOf(it) {
    if (!it.published) return '';
    var d = new Date(it.published); return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function displayTitle(it) {
    if (it.title) return it.title;
    // 没标题就用正文开头，去掉 #话题 和 @提及
    var d = (it.desc || '').replace(/[#@][^\s#@]+/g, ' ').replace(/\s+/g, ' ').trim();
    return d ? (d.length > 40 ? d.slice(0, 40) + '…' : d) : '(无标题)';
  }
  function commentShare(it) {
    var base = (it.likes || 0) + (it.collected || 0) + (it.comments || 0);
    return base ? (100 * (it.comments || 0) / base).toFixed(1) + '%' : '—';
  }
  function findRound(id) { for (var i = 0; i < ROUNDS.length; i++) if (ROUNDS[i].round.id === id) return ROUNDS[i]; return ROUNDS[0]; }

  // ---------- 卡片 ----------
  function keyBlock(it, b, sortKey) {
    var big, unit, sub;
    if (sortKey === 'ratio' && b.key === 'today') { big = it.ratio; unit = '倍'; sub = fmt(it.likes) + ' 赞 · 作者平常 ' + fmt(it.baseline) + ' 赞'; }
    else if (sortKey === 'ratio') { big = it.ratio; unit = '倍'; sub = fmt(it.likes) + ' 赞 · 粉丝 ' + fmt(it.fans); }
    else { big = fmt(it[sortKey]); unit = { likes: '赞', collected: '收藏', comments: '评论' }[sortKey];
           sub = b.key === 'today' ? '比作者平常高 ' + it.ratio + ' 倍' : b.key === 'dark' ? '粉丝 ' + fmt(it.fans) + ' · ' + it.ratio + ' 倍' : fmt(it.collected) + ' 收藏'; }
    return '<span class="key"><b>' + esc(big) + '</b><span>' + unit + '</span><em>' + esc(sub) + '</em></span>';
  }
  function card(x, i, sortKey, showBadge) {
    var it = x.it, b = x.b, r = x.r;
    var meta = ['@' + esc(it.author || '')];
    if (b.key === 'dark') meta.push('<b class="fans">发布时约 ' + fmt(it.fans) + ' 粉</b>'); else if (it.type) meta.push(esc(TYPE_NAME[it.type] || it.type));
    meta.push(showBadge ? esc(dateOf(it)) : esc(ago(it, r)));
    var stats = '<span><b>' + fmt(it.likes) + '</b> 赞</span><span><b>' + fmt(it.collected) + '</b> 藏</span>' +
                '<span><b>' + fmt(it.comments) + '</b> 评</span><span><b>' + fmt(it.shared) + '</b> 转</span>' +
                '<span title="评论 ÷ (赞+藏+评)">评论占比 <b>' + commentShare(it) + '</b></span>';
    var badge = showBadge ? '<span class="badge ' + COLOR[b.key] + '">' + esc(b.name) + '</span>' : '';
    var fav = !!favs[it.noteId];
    return '<li class="row">' +
      '<span class="rank">' + (i + 1) + '</span>' +
      (it.thumb ? '<img class="th" src="' + esc(it.thumb) + '" alt="" loading="lazy" width="72" height="72">' : '<span class="th th--none"></span>') +
      '<span class="main"><span class="t">' + badge + esc(displayTitle(it)) + '</span>' +
      '<span class="meta">' + meta.join('<i>·</i>') + '</span><span class="stats">' + stats + '</span></span>' +
      keyBlock(it, b, sortKey) +
      '<button class="star" type="button" data-id="' + esc(it.noteId) + '" aria-pressed="' + fav + '" aria-label="' + (fav ? '取消收藏' : '收藏') + '">' + (fav ? '★' : '☆') + '</button>' +
      '<a class="go" href="' + esc(it.link) + '" target="_blank" rel="noopener">打开 ↗</a></li>';
  }
  function sortBtns(b) {
    var cur = state.sort[b.key] || SORTS[b.key][0][0];
    return '<span class="sort">排序' + SORTS[b.key].map(function (s) {
      return '<button type="button" data-board="' + b.key + '" data-sort="' + s[0] + '" aria-pressed="' + (s[0] === cur) + '">' + s[1] + '</button>';
    }).join('') + '</span>';
  }
  function sorted(items, key) {
    return items.slice().sort(function (a, c) { return (c[key] || 0) - (a[key] || 0) || (c.likes || 0) - (a.likes || 0); });
  }
  function boardSection(b, r) {
    var key = state.sort[b.key] || SORTS[b.key][0][0];
    var items = sorted(b.items, key);
    var note = SORTS[b.key].filter(function (s) { return s[0] === key; })[0][1];
    return '<section id="' + b.key + '" class="' + COLOR[b.key] + '"><div class="sec"><div class="lead">' +
      '<h2>' + esc(b.name) + '<span class="cnt">' + items.length + ' 篇</span></h2>' +
      '<p class="why">' + esc(b.rule) + '<br>按<b>' + esc(note === '倍数' ? (b.key === 'today' ? '比作者平时高多少倍' : '点赞数是粉丝数的多少倍') : note) + '</b>排序' +
      (b.key === 'dark' ? '（粉丝数为上榜时数值，作者现在可能已涨粉）' : '') + '</p></div>' + sortBtns(b) + '</div>' +
      '<ul class="list">' + items.map(function (it, i) { return card({ it: it, b: b, r: r }, i, key, false); }).join('') + '</ul></section>';
  }
  function favSection() {
    var list = Object.keys(favs).map(function (id) { return BY_ID[id]; }).filter(Boolean)
      .sort(function (a, c) { return (favs[c.it.noteId] || 0) - (favs[a.it.noteId] || 0); });
    return '<section id="favs" class="star"><div class="sec"><div class="lead"><h2>我的收藏<span class="cnt">' + list.length + ' 篇</span></h2>' +
      '<p class="why">点卡片上的 ☆ 存起来，要做内容时直接从这里翻。只存在这台设备的浏览器里。</p></div></div>' +
      (list.length ? '<ul class="list">' + list.map(function (x, i) { return card(x, i, 'likes', true); }).join('') + '</ul>'
                   : '<ul class="list"><li class="empty">还没有收藏。</li></ul>') + '</section>';
  }
  function searchSection(q) {
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    var hits = ALL.filter(function (x) {
      var hay = [x.it.title, x.it.desc, x.it.author].join(' ').toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) >= 0; });
    });
    var seen = {}; hits = hits.filter(function (x) { if (seen[x.it.noteId]) return false; seen[x.it.noteId] = 1; return true; });
    hits.sort(function (a, c) { return (c.it.likes || 0) - (a.it.likes || 0); });
    return '<section id="search"><div class="sec"><div class="lead"><h2>搜索「' + esc(q) + '」<span class="cnt">' + hits.length + ' 篇</span></h2>' +
      '<p class="why">在所有轮次的三个板块里找，按点赞排序</p></div></div>' +
      (hits.length ? '<ul class="list">' + hits.map(function (x, i) { return card(x, i, 'likes', true); }).join('') + '</ul>'
                   : '<ul class="list"><li class="empty">没找到。换个词试试，比如食材名或菜名。</li></ul>') + '</section>';
  }

  // ---------- 渲染 ----------
  function renderHead() {
    var r = findRound(state.roundId), total = r.boards.reduce(function (n, b) { return n + b.items.length; }, 0);
    var pick = ROUNDS.length > 1
      ? '<select id="pick" aria-label="选择轮次">' + ROUNDS.map(function (x) { return '<option value="' + esc(x.round.id) + '"' + (x.round.id === r.round.id ? ' selected' : '') + '>' + esc(x.round.label) + ' 轮次</option>'; }).join('') + '</select>'
      : esc(r.round.label) + ' 轮次';
    document.getElementById('round').innerHTML = pick + '<span style="color:var(--faint)">·</span>共 <b>' + total + '</b> 篇';
    document.getElementById('tabs').innerHTML = r.boards.map(function (b) { return '<a href="#' + b.key + '">' + esc(b.name) + ' ' + b.items.length + '</a>'; }).join('') +
      '<a href="#favs">我的收藏 ' + Object.keys(favs).length + '</a>';
  }
  function render() {
    renderHead();
    var r = findRound(state.roundId);
    document.getElementById('boards').innerHTML = state.q
      ? searchSection(state.q)
      : r.boards.map(function (b) { return boardSection(b, r); }).join('') + favSection();
    document.getElementById('clear').hidden = !state.q;
  }
  document.getElementById('foot').innerHTML = {{FOOT_JSON}};

  // ---------- 交互 ----------
  document.getElementById('boards').addEventListener('click', function (e) {
    var t = e.target.closest('button'); if (!t) return;
    if (t.classList.contains('star')) {
      var id = t.dataset.id;
      if (favs[id]) delete favs[id]; else favs[id] = Date.now();
      saveFavs(favs); render(); return;
    }
    if (t.dataset.sort) { state.sort[t.dataset.board] = t.dataset.sort; render(); }
  });
  document.getElementById('round').addEventListener('change', function (e) {
    if (e.target.id === 'pick') { state.roundId = e.target.value; render(); }
  });
  var q = document.getElementById('q');
  q.addEventListener('input', function () { state.q = q.value.trim(); render(); });
  document.getElementById('clear').addEventListener('click', function () { q.value = ''; state.q = ''; render(); q.focus(); });
  render();
})();
</script>
</body>
</html>
